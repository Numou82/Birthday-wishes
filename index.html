<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Rakiba!</title>

  <!-- Google Fonts & Canvas Confetti Library -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #31103f, #1e1b4b);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    /* Floating Background Particles */
    .bg-heart {
      position: absolute;
      color: rgba(236, 72, 153, 0.3);
      animation: floatUp 8s linear infinite;
      user-select: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Main Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 30px 20px;
      width: 90%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Stage Area */
    .tj-stage {
      position: relative;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Fighting Dust Cloud Effect */
    .dust-cloud {
      position: absolute;
      width: 150px;
      height: 110px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      filter: blur(8px);
      animation: fightShake 0.15s infinite alternate;
    }

    /* SVG Character Containers */
    .character-box {
      width: 120px;
      height: 120px;
      position: absolute;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tom-box { left: 12%; }
    .jerry-box { right: 12%; }

    /* Fighting Animations */
    .fighting .tom-box {
      animation: brawlTom 0.2s infinite alternate;
      z-index: 3;
    }

    .fighting .jerry-box {
      animation: brawlJerry 0.2s infinite alternate;
      z-index: 4;
    }

    @keyframes brawlTom {
      0% { transform: translateX(25px) rotate(-15deg) scale(1.1); }
      100% { transform: translateX(50px) rotate(15deg) scale(0.9); }
    }

    @keyframes brawlJerry {
      0% { transform: translateX(-25px) rotate(15deg) scale(0.9); }
      100% { transform: translateX(-50px) rotate(-15deg) scale(1.1); }
    }

    @keyframes fightShake {
      0% { transform: scale(1) rotate(-5deg); }
      100% { transform: scale(1.2) rotate(5deg); }
    }

    /* Stopped / Peaceful State */
    .peaceful .dust-cloud {
      display: none;
    }

    .peaceful .tom-box {
      transform: translateX(-20px) scale(1.05);
      animation: happyBounce 0.8s infinite alternate;
    }

    .peaceful .jerry-box {
      transform: translateX(20px) scale(1.05);
      animation: happyBounce 0.8s infinite alternate 0.4s;
    }

    @keyframes happyBounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }

    /* Text Styling */
    .subtitle {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
      color: #f472b6;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .name-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.4rem;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
      margin-bottom: 12px;
      line-height: 1.1;
    }

    /* Action Button */
    .btn {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      transition: all 0.3s ease;
      outline: none;
      animation: pulseBtn 1.5s infinite;
      margin-top: 10px;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
    }

    /* Hidden Wish Reveal */
    .secret-message {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }

    .secret-message.show {
      max-height: 350px;
      opacity: 1;
      margin-top: 20px;
      padding: 20px 15px;
      border: 1px dashed rgba(244, 114, 182, 0.5);
    }

    .secret-message p {
      font-size: 0.95rem;
      color: #f3e8ff;
      line-height: 1.7;
    }

    .secret-message .highlight {
      color: #f472b6;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Background Audio File -->
  <audio id="bdayMusic" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73229.mp3?filename=happy-birthday-155461.mp3" preload="auto"></audio>

  <!-- Background Floating Particles -->
  <div id="hearts-container"></div>

  <!-- Main Birthday Card -->
  <div class="card">
    <div class="subtitle">💥 Uh oh! Tom & Jerry are fighting again... 💥</div>
    
    <!-- Tom and Jerry Vector Stage (Pure Code - Never Breaks!) -->
    <div class="tj-stage fighting" id="tjStage">
      <div class="dust-cloud"></div>
      
      <!-- Built-in Vector TOM -->
      <div class="character-box tom-box">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="45" fill="#6B7280" stroke="#FBBF24" stroke-width="4"/>
          <!-- Ears -->
          <polygon points="15,25 5,5 30,15" fill="#4B5563"/>
          <polygon points="85,25 95,5 70,15" fill="#4B5563"/>
          <polygon points="17,22 9,9 28,15" fill="#F472B6"/>
          <polygon points="83,22 91,9 72,15" fill="#F472B6"/>
          <!-- Eyes -->
          <ellipse cx="38" cy="42" rx="8" ry="12" fill="#FACC15"/>
          <ellipse cx="62" cy="42" rx="8" ry="12" fill="#FACC15"/>
          <ellipse cx="40" cy="42" rx="4" ry="8" fill="#000"/>
          <ellipse cx="60" cy="42" rx="4" ry="8" fill="#000"/>
          <!-- Nose & Mouth -->
          <ellipse cx="50" cy="56" rx="5" ry="3" fill="#F472B6"/>
          <path d="M 40 65 Q 50 75 60 65" stroke="#000" stroke-width="3" fill="none"/>
          <path d="M 50 59 L 50 67" stroke="#000" stroke-width="2"/>
          <!-- Whiskers -->
          <line x1="20" y1="55" x2="35" y2="57" stroke="#FFF" stroke-width="2"/>
          <line x1="18" y1="62" x2="35" y2="61" stroke="#FFF" stroke-width="2"/>
          <line x1="80" y1="55" x2="65" y2="57" stroke="#FFF" stroke-width="2"/>
          <line x1="82" y1="62" x2="65" y2="61" stroke="#FFF" stroke-width="2"/>
        </svg>
      </div>

      <!-- Built-in Vector JERRY -->
      <div class="character-box jerry-box">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="45" fill="#B45309" stroke="#FBBF24" stroke-width="4"/>
          <!-- Ears -->
          <circle cx="20" cy="20" r="16" fill="#92400E"/>
          <circle cx="80" cy="20" r="16" fill="#92400E"/>
          <circle cx="20" cy="20" r="10" fill="#F472B6"/>
          <circle cx="80" cy="20" r="10" fill="#F472B6"/>
          <!-- Eyes -->
          <ellipse cx="38" cy="45" rx="7" ry="10" fill="#FFF"/>
          <ellipse cx="62" cy="45" rx="7" ry="10" fill="#FFF"/>
          <circle cx="40" cy="45" r="4" fill="#000"/>
          <circle cx="60" cy="45" r="4" fill="#000"/>
          <!-- Nose & Smile -->
          <circle cx="50" cy="55" r="5" fill="#000"/>
          <path d="M 38 65 Q 50 78 62 65" stroke="#000" stroke-width="3" fill="none"/>
        </svg>
      </div>

    </div>

    <button class="btn" id="stopBtn" onclick="stopFightAndWish()">
      🛑 Break Up The Fight & Play Tune! 🎵
    </button>

    <!-- Hidden Birthday Section -->
    <div class="secret-message" id="secretMsg">
      <h1 class="name-title">Happy Birthday Rakiba! 🎉</h1>
      <p>
        <span class="highlight">Tom & Jerry stopped fighting just to wish you! 🐱🐭✨</span><br><br>
        May your special day be filled with endless smiles, hilarious moments, and all the joy in the world. Keep spreading your amazing vibe wherever you go! 🥂💖
      </p>
    </div>
  </div>

  <script>
    // Create background floating particles
    const container = document.getElementById('hearts-container');
    const heartSymbols = ['✨', '💖', '⭐', '🌸', '🎈', '🧀'];
    
    for (let i = 0; i < 22; i++) {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
      container.appendChild(heart);
    }

    // Built-in Synthesizer for Birthday Song Melody & Rhythm
    function playSynthesizedBirthdaySong() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      const notes = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
        'G4': 392.00, 'A4': 440.00, 'Bb4': 466.16, 'C5': 523.25
      };

      const song = [
        ['C4', 0.3], ['C4', 0.3], ['D4', 0.6], ['C4', 0.6], ['F4', 0.6], ['E4', 1.2],
        ['C4', 0.3], ['C4', 0.3], ['D4', 0.6], ['C4', 0.6], ['G4', 0.6], ['F4', 1.2],
        ['C4', 0.3], ['C4', 0.3], ['C5', 0.6], ['A4', 0.6], ['F4', 0.6], ['E4', 0.6], ['D4', 0.8],
        ['Bb4', 0.3], ['Bb4', 0.3], ['A4', 0.6], ['F4', 0.6], ['G4', 0.6], ['F4', 1.4]
      ];

      let startTime = ctx.currentTime + 0.1;

      song.forEach(([note, duration]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(notes[note], startTime);

        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.05);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);

        startTime += duration * 0.85;
      });
    }

    // Function to stop the fight, play music, and reveal the wish
    function stopFightAndWish() {
      const stage = document.getElementById('tjStage');
      const btn = document.getElementById('stopBtn');
      const msg = document.getElementById('secretMsg');
      const music = document.getElementById('bdayMusic');

      // 1. Play both Audio file and Synthesized Melody
      music.play().catch(() => {});
      playSynthesizedBirthdaySong();

      // 2. Stop fighting animation and switch to happy state
      stage.classList.remove('fighting');
      stage.classList.add('peaceful');

      // 3. Hide button and reveal message
      btn.style.display = 'none';
      msg.classList.add('show');

      // 4. Confetti explosion
      var duration = 3 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 60,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 60,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }
  </script>
</body>
</html>
