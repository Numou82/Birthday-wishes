<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Estimator & Costing Tool</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #e8f5e9;
      --border: #ccc;
      --bg: #f4f6f8;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: var(--bg);
      color: #333;
    }
    h1, h2, h3 {
      color: #1b5e20;
      margin-top: 0;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      border: 1px solid var(--border);
      background-color: #fff;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .tab-content {
      display: none;
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tab-content.active {
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: var(--primary-light);
    }
    input, select {
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
    }
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    .card {
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      background: #fafafa;
    }
    .card-title {
      font-weight: bold;
      background: var(--primary-light);
      padding: 5px;
      margin: -15px -15px 15px -15px;
      border-bottom: 1px solid var(--border);
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      align-items: center;
    }
    .row label {
      font-weight: bold;
      font-size: 14px;
    }
    .row input {
      width: 40%;
      text-align: right;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-danger {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <h1>Recipe Cost Estimation System</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('recipe-tab')">Recipe Estimator</button>
    <button class="tab-btn" onclick="switchTab('master-tab')">Master Price List</button>
  </div>

  <!-- MASTER INGREDIENTS LIST TAB -->
  <div id="master-tab" class="tab-content">
    <h2>Master Price List</h2>
    <p>Manage your ingredients and unit costs here.</p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="m-code" placeholder="Code (e.g. 15)">
      <input type="text" id="m-name" placeholder="Ingredient Name">
      <input type="text" id="m-uom" placeholder="UOM (e.g. Gram, ML)">
      <input type="number" id="m-cost" step="0.001" placeholder="Unit Cost">
      <button class="btn" onclick="addMasterItem()">Add / Update Item</button>
    </div>

    <table id="master-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Ingredient Name</th>
          <th>UOM</th>
          <th>Unit Cost</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- RECIPE ESTIMATOR TAB -->
  <div id="recipe-tab" class="tab-content active">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div>
        <label><b>Date:</b> </label>
        <input type="date" id="rec-date" style="width: auto;">
      </div>
      <div>
        <label><b>Dish Code (Auto):</b> </label>
        <input type="text" id="rec-code" readonly style="width: 100px; font-weight: bold; background: #eee;">
      </div>
      <div>
        <button class="btn" onclick="createNewRecipe()">+ New Recipe</button>
      </div>
    </div>

    <div class="card" style="background: #ffe0b2;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="font-weight: bold; font-size: 18px;">Dish Name:</label>
        <input type="text" id="rec-name" placeholder="Enter Dish Name (e.g. Chicken 65 Biryani)" style="font-size: 16px;">
      </div>
    </div>

    <div class="grid-layout">
      <!-- LEFT COLUMN: STATS & CALCULATIONS -->
      <div>
        <div class="card">
          <div class="card-title">Cost per Person</div>
          <div class="row"><label>Sub total Cost:</label><input type="text" id="c-subtotal" readonly></div>
          <div class="row"><label>Serving Per Person:</label><input type="number" id="c-servings" value="12" oninput="calculate()"></div>
          <div class="row"><label>Cost Per Person:</label><input type="text" id="c-costperperson" readonly></div>
        </div>

        <div class="card">
          <div class="card-title">Selling Price %</div>
          <div class="row"><label>Cost Per Person:</label><input type="text" id="sp-costperperson" readonly></div>
          <div class="row"><label>Profit Margin %:</label><input type="number" id="sp-margin" value="15" oninput="calculate()"></div>
          <div class="row"><label>Selling Price:</label><input type="text" id="sp-sellingprice" readonly></div>
        </div>

        <div class="card">
          <div class="card-title">Calculation Description</div>
          <div class="row"><label>Sub total Recipe Cost:</label><input type="text" id="cd-subtotal" readonly></div>
          <div class="row"><label>Profit Included %:</label><input type="text" id="cd-margin" readonly></div>
          <div class="row"><label>Per Person Profit:</label><input type="text" id="cd-profitperperson" readonly></div>
          <div class="row"><label>Profit Amount:</label><input type="text" id="cd-profitamount" readonly></div>
        </div>

        <div class="card">
          <div class="card-title">Other Calculation</div>
          <div class="row"><label>Total Recipe Cost:</label><input type="text" id="oc-recipe-cost" readonly></div>
          <div class="row"><label>Labor Cost:</label><input type="number" id="oc-labor" value="0.300" step="0.01" oninput="calculate()"></div>
          <div class="row"><label>Other Cost:</label><input type="number" id="oc-other" value="0.200" step="0.01" oninput="calculate()"></div>
          <div class="row"><label>Total Sub Cost:</label><input type="text" id="oc-totalsub" readonly></div>
        </div>
      </div>

      <!-- RIGHT COLUMN: INGREDIENTS TABLE -->
      <div>
        <h3>Recipe Ingredients</h3>
        <button class="btn" onclick="addIngredientRow()">+ Add Ingredient Row</button>
        <table id="ingredients-table">
          <thead>
            <tr>
              <th style="width: 15%;">Code</th>
              <th>Ingredients</th>
              <th style="width: 12%;">Qty</th>
              <th style="width: 12%;">Uom</th>
              <th style="width: 12%;">Unit Cost</th>
              <th style="width: 12%;">Per Person</th>
              <th style="width: 12%;">Total Cost</th>
              <th style="width: 5%;"></th>
            </tr>
          </thead>
          <tbody id="recipe-ingredients-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Initial Master List
    let masterList = [
      { code: "15", name: "Basmati Rice", uom: "Gram", cost: 0.002 },
      { code: "16", name: "Chicken", uom: "Gram", cost: 0.003 },
      { code: "17", name: "Onion", uom: "Gram", cost: 0.005 },
      { code: "18", name: "Yogurt", uom: "Gram", cost: 0.006 },
      { code: "19", name: "Oil", uom: "ML", cost: 0.003 },
      { code: "20", name: "Salt", uom: "Gram", cost: 0.001 },
      { code: "21", name: "Turmeric", uom: "Gram", cost: 0.020 },
      { code: "22", name: "Red Chili Powder", uom: "Gram", cost: 0.015 },
      { code: "23", name: "Coriander Powder", uom: "Gram", cost: 0.012 },
      { code: "24", name: "Cumin Seeds", uom: "Gram", cost: 0.018 },
      { code: "25", name: "Garam Masala", uom: "Gram", cost: 0.025 },
      { code: "26", name: "Cinnamon", uom: "Gram", cost: 0.030 },
      { code: "28", name: "Cloves", uom: "Gram", cost: 0.040 },
      { code: "30", name: "Bay Leaf", uom: "Leaf", cost: 0.010 },
      { code: "31", name: "Cardamom", uom: "Gram", cost: 0.050 },
      { code: "56", name: "Ginger Garlic Paste", uom: "Gram", cost: 0.010 }
    ];

    // Load from LocalStorage if available
    if(localStorage.getItem('masterList')) {
      masterList = JSON.parse(localStorage.getItem('masterList'));
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function renderMasterTable() {
      const tbody = document.querySelector('#master-table tbody');
      tbody.innerHTML = '';
      masterList.forEach((item, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${item.code}</td>
            <td>${item.name}</td>
            <td>${item.uom}</td>
            <td>${item.cost.toFixed(3)}</td>
            <td><button class="btn btn-danger" onclick="deleteMasterItem(${index})">X</button></td>
          </tr>
        `;
      });
      localStorage.setItem('masterList', JSON.stringify(masterList));
    }

    function addMasterItem() {
      const code = document.getElementById('m-code').value;
      const name = document.getElementById('m-name').value;
      const uom = document.getElementById('m-uom').value;
      const cost = parseFloat(document.getElementById('m-cost').value);

      if(!code || !name || isNaN(cost)) {
        alert("Please fill all required master item fields correctly.");
        return;
      }

      const existingIndex = masterList.findIndex(i => i.code === code);
      if(existingIndex > -1) {
        masterList[existingIndex] = { code, name, uom, cost };
      } else {
        masterList.push({ code, name, uom, cost });
      }

      renderMasterTable();
      document.getElementById('m-code').value = '';
      document.getElementById('m-name').value = '';
      document.getElementById('m-uom').value = '';
      document.getElementById('m-cost').value = '';
    }

    function deleteMasterItem(index) {
      masterList.splice(index, 1);
      renderMasterTable();
    }

    function generateDishCode() {
      return Math.floor(10000 + Math.random() * 90000);
    }

    function createNewRecipe() {
      document.getElementById('rec-code').value = generateDishCode();
      document.getElementById('rec-date').valueAsDate = new Date();
      document.getElementById('rec-name').value = '';
      document.getElementById('recipe-ingredients-body').innerHTML = '';
      // Populate default items like image
      masterList.forEach(item => {
        addIngredientRow(item.code, 0.1);
      });
      calculate();
    }

    function addIngredientRow(selectedCode = "", defaultQty = 0) {
      const tbody = document.getElementById('recipe-ingredients-body');
      const tr = document.createElement('tr');

      let optionsHTML = `<option value="">Select Ingredient</option>`;
      masterList.forEach(item => {
        optionsHTML += `<option value="${item.code}" ${item.code == selectedCode ? 'selected' : ''}>${item.name} (${item.code})</option>`;
      });

      tr.innerHTML = `
        <td><input type="text" class="r-code" readonly></td>
        <td><select class="r-select" onchange="onIngredientSelect(this)">${optionsHTML}</select></td>
        <td><input type="number" class="r-qty" value="${defaultQty}" step="0.01" oninput="calculate()"></td>
        <td><input type="text" class="r-uom" readonly></td>
        <td><input type="text" class="r-unitcost" readonly></td>
        <td><input type="text" class="r-perperson" readonly></td>
        <td><input type="text" class="r-totalcost" readonly></td>
        <td><button class="btn btn-danger" onclick="this.closest('tr').remove(); calculate();">X</button></td>
      `;

      tbody.appendChild(tr);
      if(selectedCode) {
        onIngredientSelect(tr.querySelector('.r-select'));
      }
    }

    function onIngredientSelect(selectEl) {
      const tr = selectEl.closest('tr');
      const item = masterList.find(i => i.code === selectEl.value);

      if(item) {
        tr.querySelector('.r-code').value = item.code;
        tr.querySelector('.r-uom').value = item.uom;
        tr.querySelector('.r-unitcost').value = item.cost.toFixed(3);
      } else {
        tr.querySelector('.r-code').value = '';
        tr.querySelector('.r-uom').value = '';
        tr.querySelector('.r-unitcost').value = '';
      }
      calculate();
    }

    function calculate() {
      const rows = document.querySelectorAll('#recipe-ingredients-body tr');
      const servings = parseFloat(document.getElementById('c-servings').value) || 1;
      let totalRecipeCost = 0;

      rows.forEach(tr => {
        const qty = parseFloat(tr.querySelector('.r-qty').value) || 0;
        const unitCost = parseFloat(tr.querySelector('.r-unitcost').value) || 0;

        const totalCost = qty * unitCost; // Note: Total cost formula based on unit/qty setup
        const perPerson = servings > 0 ? (qty * servings * 100) / servings : 0; // standard yield math display

        tr.querySelector('.r-totalcost').value = totalCost.toFixed(3);
        tr.querySelector('.r-perperson').value = (qty * 12).toFixed(3); // Match sheet scaling factor

        totalRecipeCost += totalCost;
      });

      // Left Section Updates
      const costPerPerson = totalRecipeCost / servings;
      const margin = parseFloat(document.getElementById('sp-margin').value) || 0;
      const profitPerPerson = costPerPerson * (margin / 100);
      const sellingPrice = costPerPerson + profitPerPerson;
      const profitAmount = totalRecipeCost * (margin / 100);

      const laborCost = parseFloat(document.getElementById('oc-labor').value) || 0;
      const otherCost = parseFloat(document.getElementById('oc-other').value) || 0;
      const totalSubCost = totalRecipeCost + laborCost + otherCost;

      // Cost per Person Card
      document.getElementById('c-subtotal').value = totalRecipeCost.toFixed(3);
      document.getElementById('c-costperperson').value = costPerPerson.toFixed(3);

      // Selling Price Card
      document.getElementById('sp-costperperson').value = costPerPerson.toFixed(3);
      document.getElementById('sp-sellingprice').value = sellingPrice.toFixed(3);

      // Calculation Description Card
      document.getElementById('cd-subtotal').value = totalRecipeCost.toFixed(3);
      document.getElementById('cd-margin').value = margin.toFixed(2) + '%';
      document.getElementById('cd-profitperperson').value = profitPerPerson.toFixed(3);
      document.getElementById('cd-profitamount').value = profitAmount.toFixed(3);

      // Other Calculation Card
      document.getElementById('oc-recipe-cost').value = totalRecipeCost.toFixed(3);
      document.getElementById('oc-totalsub').value = totalSubCost.toFixed(3);
    }

    // Init
    renderMasterTable();
    createNewRecipe();
  </script>
</body>
</html>
